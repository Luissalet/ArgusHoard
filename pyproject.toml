[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-hoard"
version = "0.1.0"
description = "Private, local screen memory: periodic captures with OCR, timeline and full-text search, exposed to assistants through MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Luissalet" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "mcp>=1.10,<2",
  "pillow>=10.1",
  "numpy>=1.26",
  "mss>=9",
  "psutil>=5.9",
  "rapidocr>=3.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
windows = ["pywin32>=306; sys_platform == 'win32'", "winocr>=0.0.13; sys_platform == 'win32'"]
tesseract = ["pytesseract>=0.3.10"]

[project.scripts]
argus-hoard = "argus.__main__:main"

[tool.setuptools.packages.find]
include = ["argus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
